version: 0.2

env:
  variables:
    SAM_BUCKET: ""          # Set via CodeBuild project or pipeline
    STACK_NAME: "file-ingestion-pipeline"
    AWS_REGION: "us-east-1"
    ENVIRONMENT: "dev"
  parameter-store:
    # Optionally pull secrets / config from SSM
    # DB_PASSWORD: /file-ingestion/dev/db-password

phases:
  install:
    runtime-versions:
      python: "3.12"
    commands:
      - echo "Installing dependencies..."
      - pip install --upgrade pip
      - pip install -r requirements-dev.txt 2>/dev/null || true
      - pip install aws-sam-cli pytest pytest-cov moto boto3 aws-lambda-powertools

  pre_build:
    commands:
      - echo "Running unit tests..."
      - python -m unittest discover tests -v
      - echo "Linting..."
      - pip install ruff 2>/dev/null && ruff check src/ || true

  build:
    commands:
      - echo "SAM build..."
      - sam build --template-file template.yaml --use-container --parallel

  post_build:
    commands:
      - echo "SAM package..."
      - |
        sam package \
          --template-file .aws-sam/build/template.yaml \
          --s3-bucket "${SAM_BUCKET}" \
          --s3-prefix "${STACK_NAME}" \
          --output-template-file packaged.yaml \
          --region "${AWS_REGION}"
      - echo "SAM deploy..."
      - |
        sam deploy \
          --template-file packaged.yaml \
          --stack-name "${STACK_NAME}-${ENVIRONMENT}" \
          --capabilities CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND \
          --parameter-overrides "Environment=${ENVIRONMENT}" \
          --no-confirm-changeset \
          --no-fail-on-empty-changeset \
          --region "${AWS_REGION}"
      - echo "Deploy complete."

artifacts:
  type: zip
  files:
    - packaged.yaml
    - template.yaml

cache:
  paths:
    - "/root/.cache/pip/**/*"
    - ".aws-sam/**/*"
